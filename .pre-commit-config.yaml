# Pre-commit hooks for Terraform policy-as-code
# Catches OWASP API Security Top 10 (2023) risks before commit.
#
# Setup:
#   pip install pre-commit
#   pre-commit install
#   pre-commit run --all-files   # run on the whole repo once
#
# Hooks are ordered fastest-first for quick local feedback.
# CI (.github/workflows/policy-as-code.yml) is the authoritative gate,
# since local hooks can be bypassed with `git commit --no-verify`.

repos:
  # ---------------------------------------------------------------------------
  # Terraform formatting + validation (baseline hygiene -> API8 Misconfig)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true

  # ---------------------------------------------------------------------------
  # Secrets scanning (API2 Broken Auth, API8 Misconfig)
  # Stops hardcoded keys/tokens from ever being committed.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------------
  # Checkov IaC scanning (API4, API7, API8 primarily)
  # Includes the repo's custom OWASP-mapped policies in policies/checkov.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/bridgecrewio/checkov.git
    rev: '3.2.334'
    hooks:
      - id: checkov
        args:
          - --directory
          - terraform
          - --external-checks-dir
          - policies/checkov
          - --compact
          - --quiet
          - --soft-fail-on
          - LOW

  # ---------------------------------------------------------------------------
  # Trivy config scanning (defense-in-depth with Checkov; also finds CVEs)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/aquasecurity/trivy
    rev: v0.57.1
    hooks:
      - id: trivy
        name: trivy-config
        args:
          - config
          - --severity
          - HIGH,CRITICAL
          - --exit-code
          - '1'
          - terraform

  # ---------------------------------------------------------------------------
  # Spectral OpenAPI linting with OWASP API ruleset (API1/API2/API3/API5/API9)
  # Lints the API contract itself, not just the infra.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: spectral-owasp
        name: spectral-owasp (OpenAPI lint)
        language: node
        additional_dependencies:
          - '@stoplight/spectral-cli@6.14.2'
          - '@stoplight/spectral-owasp-ruleset@2.5.0'
        entry: spectral lint
        args:
          - --ruleset
          - .spectral.yaml
          - --fail-severity
          - warn
        files: ^api/.*\.(ya?ml|json)$
