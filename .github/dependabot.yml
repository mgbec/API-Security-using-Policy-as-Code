version: 2
updates:
  # Keep the GitHub Actions used in the policy-as-code workflow current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci

  # Keep the pinned Python tools (checkov, semgrep, pre-commit) current.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps

  # Keep the Terraform AWS provider constraint current.
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    labels:
      - dependencies
      - terraform
    commit-message:
      prefix: deps
